# FORGE — local development stack.
#
#   make dev     start everything
#   make down    stop everything (emulator state is exported first)
#
# Services
#   emulator  Firebase Auth + Firestore + Emulator UI (bundles its own JRE)
#   web       Next.js dev server with hot reload
#
# The browser — not the web container — talks to the emulator, which is why the
# emulator ports are published to the host and NEXT_PUBLIC_EMULATOR_HOST is
# "localhost" rather than a compose service name.

name: forge

services:
  emulator:
    build:
      context: .
      dockerfile: docker/emulator.Dockerfile
    container_name: forge-emulator
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-forge-local}
      # Hosting is excluded on purpose: it would try to serve out/, which does
      # not exist until a build has run. `make preview` covers that separately.
      EMULATOR_ONLY: auth,firestore
      # The mount point. State is written to a `data/` subdirectory of it — see
      # docker/emulator-entrypoint.sh for why that indirection is required.
      EMULATOR_DATA_ROOT: /workspace/.emulator-data
    ports:
      - "9099:9099" # Auth
      - "8080:8080" # Firestore
      - "4000:4000" # Emulator UI
      - "4400:4400" # Hub
      - "4500:4500" # Logging
    volumes:
      # Config the emulators read on boot.
      - ./firebase.json:/workspace/firebase.json:ro
      - ./firestore.rules:/workspace/firestore.rules:ro
      - ./firestore.indexes.json:/workspace/firestore.indexes.json:ro
      - ./.firebaserc:/workspace/.firebaserc:ro
      # Persisted Auth users + Firestore documents.
      - ./.emulator-data:/workspace/.emulator-data
    healthcheck:
      # The hub lists running emulators once the suite is actually accepting
      # connections — a better readiness signal than a TCP port check.
      test: ["CMD", "curl", "-fsS", "http://localhost:4400/emulators"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: forge-web
    command: npm run dev
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      # Point the client SDK at the emulator suite.
      NEXT_PUBLIC_USE_FIREBASE_EMULATOR: "true"
      NEXT_PUBLIC_EMULATOR_HOST: localhost
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_PORT: "9099"
      NEXT_PUBLIC_FIRESTORE_EMULATOR_PORT: "8080"
      # The emulator accepts any project id; these keep the SDK happy offline.
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-forge-local}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-demo-api-key}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-forge-local.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-forge-local.firebasestorage.app}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-000000000000}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:000000000000:web:local}
    ports:
      - "3000:3000"
    volumes:
      # Source is bind-mounted for hot reload...
      - .:/app
      # ...but these stay inside the container: node_modules holds Linux-native
      # binaries (Tailwind oxide, lightningcss) that would be clobbered by the
      # host's macOS build, and .next is build output.
      - forge_node_modules:/app/node_modules
      - forge_next_cache:/app/.next
    depends_on:
      emulator:
        condition: service_healthy

  # Serves the built `out/` directory through the Firebase Hosting emulator, so
  # cleanUrls, cache headers and 404 handling can be checked against the real
  # hosting config before deploying. Behind a profile so `make dev` ignores it.
  #
  #   make preview
  preview:
    profiles: [preview]
    build:
      context: .
      dockerfile: docker/emulator.Dockerfile
    container_name: forge-preview
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-forge-local}
      EMULATOR_ONLY: hosting
    ports:
      # Host 5050, not 5000: on macOS the AirPlay Receiver (ControlCenter) holds
      # port 5000 and answers with 403, which looks exactly like a broken deploy.
      - "5050:5000"
    volumes:
      - ./firebase.json:/workspace/firebase.json:ro
      - ./.firebaserc:/workspace/.firebaserc:ro
      # The build output being served. Read-only: previewing must never mutate it.
      - ./out:/workspace/out:ro

volumes:
  forge_node_modules:
  forge_next_cache:
